name: CI

# Build verification only — runs on PRs and pushes to main.
# Does NOT deploy. Production deploy is gated on publishing a release
# (see deploy.yml, triggered on `release: published`).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun run build

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 🏗️ Build verification — \`${{ job.status }}\`"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Bun | $(bun --version) |"
            echo "| Node | $(node --version) |"
            echo "| Astro | $(node -p "require('astro/package.json').version" 2>/dev/null || echo n/a) |"
            echo "| Pages built | $(find dist -name '*.html' 2>/dev/null | wc -l | tr -d ' ') |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
