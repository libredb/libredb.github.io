# Rebuilds the CasaOS / ZimaOS store the site serves at /casaos-store.
#
# WHY A WORKFLOW AND NOT A NOTE IN A README. The store's output has to follow the
# release, and a regeneration step that only exists as an instruction is a step
# nobody runs: the same week this store was written, six provider CI steps in the
# product repository sat unused in files that asked a person to paste them, and
# the AWS listing stayed five releases behind because its only documented path was
# "do it in the portal". So the build runs here, on a push to the source and on
# demand, and it commits the result.
#
# It is IceWhaleTech's own action, the one their third-party store guide names, so
# the output follows their protocol rather than our reading of it.
name: CasaOS Store

on:
  push:
    branches: [main]
    paths:
      - 'casaos-store/**'
      - '.github/workflows/casaos-store.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: casaos-store
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish the store
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the store
        uses:
          IceWhaleTech/build-appstore-action@c9bb47fad5b32d7928a07978fad68801f52e910f # v1.1.3 - `v1` is NOT a tag in that
          # repository (its tags are v1.0.1 ... v1.1.3), and this repository pins every
          # action by commit anyway.
        with:
          source: casaos-store
          output: public/casaos-store
          base-url: https://libredb.org/casaos-store

      - name: Open a pull request with the output when it changed
        # It opens a pull request rather than pushing to main. 1 Nov: the push step
        # failed on every run with `GH013: Changes must be made through a pull
        # request`, so the store the site served stayed at the version it was first
        # built with while casaos-store/ moved on.
        #
        # Plain git and `gh` rather than an action: the first attempt used
        # peter-evans/create-pull-request, whose git push answered HTTP 400 here.
        #
        # `git diff --quiet` decides, so an unchanged build opens nothing: the build
        # rewrites every file each run, and an unconditional pull request would open
        # an empty-looking one on every push.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- public/casaos-store; then
            echo "::notice::The generated store is unchanged."
            exit 0
          fi
          dal="casaos-store/rebuild-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$dal"
          git add public/casaos-store
          git commit -m "chore(casaos-store): rebuild the generated store"
          git push origin "$dal"
          gh pr create --base "${GITHUB_REF_NAME}" --head "$dal" \
            --title "chore(casaos-store): rebuild the generated store" \
            --body "The CasaOS Store workflow rebuilt \`public/casaos-store\` from \`casaos-store/\`.

          Merging this publishes the rebuilt store the next time the site deploys."
