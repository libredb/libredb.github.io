<!doctype html>
<!--
  Open Graph card source, 1200x630.

  Rendered once in a real browser (so Plus Jakarta Sans and JetBrains Mono are
  the actual shipped faces) and committed as public/og/default.png:

      bun run build
      node scripts/og/build-og.mjs

  It is served out of dist/ during generation so that /_astro/*.css, the brand
  lockup and the hero plate all resolve exactly as they do on the site.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>og</title>
    <link rel="stylesheet" href="__CSS__" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--neutral-1000);
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        box-sizing: border-box;
        overflow: hidden;
      }
      .plate {
        position: absolute;
        inset: 0;
      }
      .plate img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
      }
      .veil {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            70% 90% at 30% 40%,
            rgb(11 13 24 / 0.82) 0%,
            rgb(11 13 24 / 0.62) 55%,
            rgb(11 13 24 / 0.4) 100%
          ),
          linear-gradient(180deg, rgb(11 13 24 / 0.35) 0%, rgb(11 13 24 / 0.55) 60%, var(--neutral-1000) 100%);
      }
      .rule {
        position: absolute;
        inset: 0 0 auto 0;
        height: 6px;
        background: var(--gradient-brand);
      }
      .top,
      .bottom {
        position: relative;
      }
      .logo {
        width: 280px;
        height: auto;
        display: block;
      }
      h1 {
        margin: 28px 0 0;
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 62px;
        line-height: 1.06;
        letter-spacing: -0.03em;
        color: #fff;
        max-width: 940px;
      }
      h1 .grad {
        background-image: linear-gradient(135deg, var(--primary-400), var(--secondary-400));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 26px 0 0;
        max-width: 820px;
        font-size: 25px;
        line-height: 1.5;
        color: #c3c9e0;
      }
      .bottom {
        display: flex;
        align-items: center;
        gap: 18px;
        font: 500 21px/1 var(--font-mono);
        color: #a8b0cc;
      }
      .chip {
        padding: 12px 18px;
        border: 1px solid #3a416a;
        border-radius: 999px;
        background: rgb(13 16 32 / 0.72);
        color: #dfe4f8;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 9px;
        border-radius: 50%;
        background: var(--accent-500);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="plate"><img src="/hero-bg-f.jpg" alt="" /></div>
      <div class="veil"></div>
      <div class="rule"></div>

      <div class="top">
        <img class="logo" src="/brand/lb-logo-h-white.svg" alt="" />
        <h1>You created the database.<br /><span class="grad">The editor is already beside it.</span></h1>
      </div>

      <div class="bottom">
        <span class="chip"><span class="dot"></span> Open source · MIT</span>
        <span class="chip">docker run libredb/libredb-studio</span>
        <span>libredb.org</span>
      </div>
    </div>
  </body>
</html>
