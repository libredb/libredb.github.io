# Reproducible installs: `bun add` records exact versions (no ^ ranges) instead
# of caret ranges, so new dependencies can't silently float to a newer minor.
# Existing dependencies in package.json are all pinned exact to match; Dependabot
# proposes version bumps explicitly. Mirrors the sibling libredb-database repo,
# relaxed for a website.
[install]
exact = true
