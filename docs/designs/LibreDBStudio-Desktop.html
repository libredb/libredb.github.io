document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    const templateData = JSON.parse(templateEl.textContent);
    const pages = templateData.pages;
    const entryId = templateData.entry;
    const pageIds = Object.keys(pages);

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    // Per-page prep: substitute UUIDs, strip SRI/crossorigin (blob URLs from a
    // file:// document inherit a null origin, so crossorigin forces a CORS
    // fetch that SRI then rejects — the manifest bytes are ours; SRI protects
    // against CDN compromise, not this), and inject the page's own
    // window.__resources + the click interceptor into <head>. slice() rather
    // than replace() keeps us clear of $-pattern substitution.
    function resourcesFor(id) {
      var map = {};
      var list = extResources[id] || [];
      for (var k = 0; k < list.length; k++) {
        if (blobUrls[list[k].uuid]) map[list[k].id] = blobUrls[list[k].uuid];
      }
      return map;
    }
    for (const id of pageIds) {
      let t = pages[id];
      for (const uuid of uuids) t = t.split(uuid).join(blobUrls[uuid]);
      t = t.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');
      // The click interceptor owns every anchor click (not a <base target>):
      // a blanket <base target="_parent"> would also redirect form submissions
      // and tear down the wrapper. Non-# links navigate the parent to the
      // anchor's resolved href; #/… routes forward to the parent's hash only
      // when the id is one of this bundle's own pages (author #/… links from
      // an in-page hash router are left to the scroll path so they don't yank
      // the user to the entry page); plain #frag scrolls in place.
      // composedPath + getAttribute('target') handle SVG <a> and shadow-DOM
      // anchors, which closest()/IDL .target get wrong.
      var headContent = 'window.__resources = ' + JSON.stringify(resourcesFor(id)) + ';' +
        (pageIds.length > 1 ?

          'document.addEventListener("click", function(e){' +
            'if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.defaultPrevented) return;' +
            'var a = null, p = e.composedPath ? e.composedPath() : [e.target];' +

              'if (tn === "A" || tn === "a" || tn === "AREA") a = n;' +
            '}' +
            'if (!a && e.target.closest) a = e.target.closest("a, area");' +
            'if (!a || a.hasAttribute("download")) return;' +
            'var tg = a.getAttribute("target");' +
            'if (tg && tg !== "_self") return;' +
            'var h = a.getAttribute("href") || a.getAttribute("xlink:href");' +
            'if (!h || /^javascript:/i.test(h)) return;' +
            'if (h.charAt(0) !== "#") {' +
              'if (!tg) { var b = document.querySelector("base[target]"); if (b && b.getAttribute("target") !== "_self") return; }' +
              'e.preventDefault();' +
              'if (/^(?:[a-z][a-z0-9+.-]*:|\\/\\/)/i.test(h)) parent.location.assign(h);' +
              'return;' +
            '}' +
            'e.preventDefault();' +
            'if (h.slice(0, 2) === "#/") {' +
              'var c = h.indexOf(":", 2);' +
              'var pid = c < 0 ? h.slice(2) : h.slice(2, c);' +
              'try { pid = decodeURIComponent(pid); } catch(err) {}' +
              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +
            '}' +
            'var t = h.length > 1 ? document.getElementById(h.slice(1)) : null;' +
            'if (t) t.scrollIntoView({behavior:"smooth"});' +
            'else scrollTo({top:0, behavior:"smooth"});' +
          '});' : '');
      // Defuse any script end-tag sequence in the content (resource ids, page
      // ids) before wrapping — same escape level as every sibling JSON island.
      var headScript = '<script>' +
        headContent.split('</' + 'script').join('<\\/' + 'script') +
        '</' + 'script>';
      // Inject after <head> so the DOCTYPE stays first; prepending the script
      // would push the parser into quirks mode. DOMParser always emits a <head>
      // (synthesizing one if the source HTML omitted it) but may carry
      // attributes through, so match the full opening tag.
      var headOpen = t.match(/<head[^>]*>/i);
      if (headOpen) {
        var hi = headOpen.index + headOpen[0].length;
        t = t.slice(0, hi) + headScript + t.slice(hi);
      }
      pages[id] = t;
    }

    setStatus('Rendering...');

    if (pageIds.length === 1) {
      // Single page: the pre-crawl render path. Parse the template and swap the
      // root element. Scripts inserted via DOMParser/replaceWith are inert per
      // spec — re-create each with createElement so they execute, awaiting
      // onload for src scripts to preserve ordering (React before ReactDOM
      // before Babel before text/babel).
      var template = pages[entryId];
      const doc = new DOMParser().parseFromString(template, 'text/html');
      document.documentElement.replaceWith(doc.documentElement);
      const dead = Array.from(document.scripts);
      for (const old of dead) {
        const s = document.createElement('script');
        for (const a of old.attributes) s.setAttribute(a.name, a.value);
        s.textContent = old.textContent;
        // text/babel scripts with a src: fetch and inline. transformScriptTags
        // does XHR against the src, but blob:null/ from a file:// origin is
        // silently dropped. Inlining makes it a plain inline babel script,
        // which transformScriptTags handles unconditionally.
        if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
          try {
            const r = await fetch(s.src);
            s.textContent = await r.text();
            s.removeAttribute('src');
          } catch (e) {}
        }
        // Non-executable script types (text/babel, application/json, …) are
        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.
        const exec = !s.type || s.type === 'module' || /(java|ecma)script/i.test(s.type);
        const p = (s.src && exec) ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
        old.replaceWith(s);
        if (p) await p;
      }
      // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }
      return;
    }

    // Multi-page: render into a full-viewport srcdoc iframe so each page runs
    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      current = id;
      var gen = ++navGen;
      frame.onload = function() {
        // One-shot: an iframe-internal navigation (form submit, page JS
        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}
        var splash = document.getElementById('__bundler_thumbnail') ||
                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);
      };
      frame.srcdoc = pages[id];
    }

    window.addEventListener('hashchange', navigate);
    navigate();
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t:800;color:#f4f4f5;margin:0 0 6px;\">Built with modern tech<\u002Fh2>\n            <p style=\"color:#71717a;font-size:13px;margin:0 0 26px;\">Production-ready stack for performance and scalability.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;\">\n              <sc-for list=\"{{techStack}}\" as=\"g\" hint-placeholder-count=\"4\">\n                <div style=\"background:#0c0c0f;border:1px solid #1d1d22;border-radius:10px;padding:18px;\">\n                  <div style=\"color:{{accent}};font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;\">{{g.group}}<\u002Fdiv>\n                  <sc-for list=\"{{g.items}}\" as=\"it\" hint-placeholder-count=\"4\"><div style=\"margin-bottom:13px;\"><div style=\"color:#e4e4e7;font-size:13px;font-weight:600;\">{{it.n}}<\u002Fdiv><div style=\"color:#52525b;font-size:11px;margin-top:2px;\">{{it.s}}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- GET STARTED -->\n        <sc-if value=\"{{isGetStarted}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"padding:32px 40px;\">\n            <h2 style=\"font-size:24px;font-weight:800;color:#f4f4f5;margin:0 0 6px;\">Get started in minutes<\u002Fh2>\n            <p style=\"color:#71717a;font-size:13px;margin:0 0 26px;\">Up and running with three simple steps.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n              <sc-for list=\"{{steps}}\" as=\"st\" hint-placeholder-count=\"3\">\n                <div style=\"background:#0c0c0f;border:1px solid #1d1d22;border-radius:11px;overflow:hidden;\">\n                  <div style=\"display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid #1d1d22;\"><span style=\"width:24px;height:24px;border-radius:7px;background:{{accent}};color:#fff;font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;\">{{st.n}}<\u002Fspan><span style=\"color:#e4e4e7;font-weight:700;font-size:14px;\">{{st.t}}<\u002Fspan><\u002Fdiv>\n                  <div style=\"padding:16px 18px;font-size:12px;line-height:1.85;color:#a1a1aa;white-space:pre-wrap;\">{{st.code}}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- FAQ -->\n        <sc-if value=\"{{isFaq}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"padding:32px 40px;\">\n            <h2 style=\"font-size:24px;font-weight:800;color:#f4f4f5;margin:0 0 6px;\">Frequently asked questions<\u002Fh2>\n            <p style=\"color:#71717a;font-size:13px;margin:0 0 26px;\">Everything you need to know about LibreDB Studio.<\u002Fp>\n            <div style=\"border:1px solid #1d1d22;border-radius:11px;overflow:hidden;max-width:860px;\">\n              <sc-for list=\"{{faqs}}\" as=\"f\" hint-placeholder-count=\"7\">\n                <div onclick=\"{{f.toggle}}\" style=\"border-top:1px solid #1d1d22;cursor:pointer;\">\n                  <div style=\"display:flex;align-items:center;gap:12px;padding:16px 20px;\"><span style=\"color:{{accent}};font-size:13px;\">{{f.icon}}<\u002Fspan><span style=\"flex:1;color:#e4e4e7;font-weight:600;font-size:14px;\">{{f.q}}<\u002Fspan><span style=\"color:#52525b;\">{{f.chev}}<\u002Fspan><\u002Fdiv>\n                  <sc-if value=\"{{f.open}}\" hint-placeholder-val=\"{{false}}\"><div style=\"padding:0 20px 18px 45px;color:#a1a1aa;font-size:13px;line-height:1.7;\">{{f.a}}<\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- DEPLOY -->\n        <sc-if value=\"{{isDeploy}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"padding:32px 40px;\">\n            <h2 style=\"font-size:24px;font-weight:800;color:#f4f4f5;margin:0 0 6px;\">Deploy anywhere<\u002Fh2>\n            <p style=\"color:#71717a;font-size:13px;margin:0 0 26px;\">One open-source image, every layer of the deploy stack — 39+ platforms and 5 install methods.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px;\">\n              <sc-for list=\"{{deployCats}}\" as=\"cat\" hint-placeholder-count=\"5\">\n                <div style=\"background:#0c0c0f;border:1px solid #1d1d22;border-radius:10px;padding:16px;\"><div style=\"font-size:22px;font-weight:800;color:{{accent}};\">{{cat.c}}<\u002Fdiv><div style=\"color:#71717a;font-size:11px;margin-top:6px;line-height:1.45;\">{{cat.n}}<\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:9px;\">\n              <sc-for list=\"{{deployChips}}\" as=\"chip\" hint-placeholder-count=\"16\"><span style=\"border:1px solid #1d1d22;background:#0c0c0f;border-radius:8px;padding:8px 14px;font-size:12.5px;color:#a1a1aa;\">{{chip}}<\u002Fspan><\u002Fsc-for>\n              <span style=\"border:1px solid #27272d;border-radius:8px;padding:8px 14px;font-size:12.5px;color:#52525b;\">+15 more →<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== STATUS BAR ===================== -->\n  <div style=\"display:flex;align-items:center;gap:16px;height:26px;flex:none;padding:0 14px;background:{{accent}};color:#0a0f1e;font-size:11px;font-weight:600;\">\n    <span>● Connected<\u002Fspan><span>PostgreSQL 16.2<\u002Fspan><span>public<\u002Fspan><span>{{queryName}}<\u002Fspan>\n    <div style=\"flex:1;\"><\u002Fdiv>\n    <span>{{meta.rc}}<\u002Fspan><span>Ln 1, Col 1<\u002Fspan><span>UTF-8<\u002Fspan><span>SQL<\u002Fspan><span>◆ LibreDB Studio v0.9.29<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2f6feb&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;keywordColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#f07178&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;liveTyping&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { typed: 0, active: 'home', openFaq: 0 };\n\n  pages() {\n    return {\n      home: { label:'home', query:'SELECT * FROM libredb_studio;', count:'1',\n        cols:[{label:'headline',type:'TEXT'},{label:'tagline',type:'TEXT'},{label:'stats',type:'JSONB'}],\n        meta:{ rc:'1 row', cc:3, exec:3 } },\n      features: { label:'features', query:'SELECT name, category, summary FROM features ORDER BY category;', count:'17',\n        cols:[{label:'name',type:'VARCHAR'},{label:'category',type:'ENUM'},{label:'summary',type:'TEXT'}],\n        meta:{ rc:'17 rows', cc:3, exec:4 } },\n      databases: { label:'databases', query:'SELECT name, type, driver FROM supported_databases;', count:'7',\n        cols:[{label:'name',type:'VARCHAR'},{label:'type',type:'VARCHAR'},{label:'driver',type:'VARCHAR'}],\n        meta:{ rc:'7 rows', cc:3, exec:2 } },\n      compare: { label:'compare', query:'SELECT * FROM tools ORDER BY freedom DESC;', count:'5',\n        cols:[{label:'tool',type:'VARCHAR'},{label:'scores',type:'BOOL[]'},{label:'price',type:'VARCHAR'}],\n        meta:{ rc:'5 rows', cc:7, exec:5 } },\n      tech_stack: { label:'tech_stack', query:'SELECT layer, tools FROM tech_stack;', count:'4',\n        cols:[{label:'layer',type:'VARCHAR'},{label:'tools',type:'TEXT[]'}],\n        meta:{ rc:'4 rows', cc:2, exec:3 } },\n      get_started: { label:'get_started', query:'SELECT step, title, command FROM quickstart ORDER BY step;', count:'3',\n        cols:[{label:'step',type:'INT'},{label:'title',type:'VARCHAR'},{label:'command',type:'TEXT'}],\n        meta:{ rc:'3 rows', cc:3, exec:1 } },\n      faq: { label:'faq', query:'SELECT question, answer FROM faq;', count:'7',\n        cols:[{label:'question',type:'TEXT'},{label:'answer',type:'TEXT'}],\n        meta:{ rc:'7 rows', cc:2, exec:6 } },\n      deploy: { label:'deploy', query:'SELECT platform, category FROM deploy_targets ORDER BY category;', count:'39',\n        cols:[{label:'platform',type:'VARCHAR'},{label:'category',type:'VARCHAR'},{label:'method',type:'VARCHAR'}],\n        meta:{ rc:'39 rows', cc:3, exec:8 } }\n    };\n  }\n\n  tokenizeSQL(sql) {\n    const kw = new Set(['SELECT','FROM','WHERE','LIMIT','ORDER','BY','AND','OR','ASC','DESC','JOIN','LEFT','INNER','ON','AS','GROUP','HAVING','COUNT','NULL','NOT','IS']);\n    const kc = this.props.keywordColor || '#f07178';\n    const out = []; const re = /(\\s+|--[^\\n]*|[A-Za-z_][A-Za-z0-9_]*|[0-9]+|[^\\sA-Za-z0-9_])/g; let m;\n    while ((m = re.exec(sql))) {\n      const tk = m[0]; let c = '#d4d4d8';\n      if (/^\\s+$/.test(tk)) c = '#d4d4d8';\n      else if (/^--/.test(tk)) c = '#52525b';\n      else if (/^[0-9]+$/.test(tk)) c = '#56b6c2';\n      else if (kw.has(tk.toUpperCase())) c = kc;\n      else if (/^[A-Za-z_]/.test(tk)) c = '#d4d4d8';\n      else c = '#6b7280';\n      out.push({ t: tk, c });\n    }\n    return out;\n  }\n  segLen(s) { let n = 0; for (const x of s) n += x.t.length; return n; }\n  clip(segs, n) { const out = []; let acc = 0; for (const s of segs) { if (acc >= n) break; const end = acc + s.t.length; out.push(end <= n ? s : { t: s.t.slice(0, n - acc), c: s.c }); acc = end; } return out; }\n  curQuery() { return this.pages()[this.state.active].query; }\n\n  componentDidMount() {\n    if (this.props.liveTyping === false) { this.setState({ typed: this.curQuery().length }); return; }\n    this.timer = setInterval(() => { this.setState(s => { const len = this.curQuery().length; return s.typed < len ? { typed: s.typed + 1 } : null; }); }, 26);\n  }\n  componentWillUnmount() { if (this.timer) clearInterval(this.timer); }\n  selectPage(key) { this.setState({ active: key, typed: this.props.liveTyping === false ? this.pages()[key].query.length : 0 }); }\n  run() { this.setState({ typed: this.props.liveTyping === false ? this.curQuery().length : 0 }); }\n\n  renderVals() {\n    const accent = this.props.accent || '#2f6feb';\n    const kwColor = this.props.keywordColor || '#f07178';\n    const pg = this.pages();\n    const order = ['home','features','databases','compare','tech_stack','get_started','faq','deploy'];\n    const active = pg[this.state.active];\n\n    const pages = order.map(key => {\n      const isA = key === this.state.active;\n      return { key, label: pg[key].label, count: pg[key].count, active: isA, cols: pg[key].cols,\n        caret: isA ? '▾' : '▸', bg: isA ? '#141417' : 'transparent', fg: isA ? '#e4e4e7' : '#a1a1aa',\n        select: () => this.selectPage(key) };\n    });\n\n    const tokens = this.clip(this.tokenizeSQL(active.query), this.state.typed);\n\n    const G = '#4ade80', R = '#f87171', MU = '#52525b', O = '#fbbf24';\n    const yes = { t:'true', c:G }, no = { t:'false', c:R };\n\n    const features = [\n      { n:'Monaco SQL IDE', d:'VS Code engine with schema-aware autocomplete, multi-tab workspace, and SQL formatting.', cat:'editor', c:'#3f7bd6' },\n      { n:'NL2SQL Copilot', d:'Ask in plain English, get executable SQL. Schema-aware multi-model AI.', cat:'ai', c:'#c678dd' },\n      { n:'AI Query Safety', d:'Pre-execution risk analysis for destructive queries (DELETE, DROP, TRUNCATE).', cat:'ai', c:'#c678dd' },\n      { n:'7+ Databases', d:'PostgreSQL, MySQL, Oracle, SQL Server, SQLite, MongoDB, Redis — one interface.', cat:'core', c:'#56b6c2' },\n      { n:'Pro Data Grid', d:'Virtualized rendering, column filtering, inline editing, pivot, CSV/JSON export.', cat:'data', c:'#56b6c2' },\n      { n:'Visual EXPLAIN', d:'Graphical execution plans with AI plain-language explanations and tips.', cat:'data', c:'#56b6c2' },\n      { n:'ER Diagrams', d:'Interactive schema graph with relationships, ReactFlow-powered navigation.', cat:'schema', c:'#e5c07b' },\n      { n:'AI Data Profiler', d:'One-click profiling: column stats, null %, cardinality, AI summaries.', cat:'ai', c:'#c678dd' },\n      { n:'ORM Code Generator', d:'TypeScript, Zod, Prisma, Go, Python, Java POJOs from live schemas.', cat:'tooling', c:'#fbbf24' },\n      { n:'Test Data Generator', d:'Schema-aware fake data with 30+ semantic inferences (email, phone, name).', cat:'tooling', c:'#fbbf24' },\n      { n:'AI Query Autopilot', d:'Automated slow-query analysis with index & rewrite recommendations.', cat:'ai', c:'#c678dd' },\n      { n:'DBA Toolkit', d:'Live monitoring, active sessions, VACUUM/ANALYZE/REINDEX, query auditing.', cat:'dba', c:'#f87171' },\n      { n:'DB Documentation', d:'Auto-generated searchable data dictionary with Markdown export.', cat:'schema', c:'#e5c07b' },\n      { n:'SSO / OIDC', d:'Vendor-agnostic OIDC: Auth0, Keycloak, Okta, Azure AD. PKCE + role mapping.', cat:'security', c:'#4ade80' },\n      { n:'Enterprise Security', d:'JWT, RBAC, SSL/TLS, SSH Tunnel, transaction control, query cancellation.', cat:'security', c:'#4ade80' },\n      { n:'Data Masking', d:'Auto-detect sensitive columns. RBAC-enforced with export protection.', cat:'security', c:'#4ade80' },\n      { n:'Mobile Ready', d:'Touch-optimized responsive UI for tablets and phones — manage anywhere.', cat:'ux', c:'#f87171' }\n    ];\n    const databases = [\n      { n:'PostgreSQL', t:'relational', drv:'pg', c:'#3f7bd6' },\n      { n:'MySQL', t:'relational', drv:'mysql2', c:'#fbbf24' },\n      { n:'Oracle', t:'relational', drv:'oracledb', c:'#f87171' },\n      { n:'SQL Server', t:'relational', drv:'mssql', c:'#56b6c2' },\n      { n:'SQLite', t:'embedded', drv:'better-sqlite3', c:'#4ade80' },\n      { n:'MongoDB', t:'document', drv:'mongodb', c
